name: Update Historical Data

on:
  schedule:
    # Run every day at 10:00 UTC (18:00 Taiwan time)
    # The Taiwan market closes at 13:30, so 18:00 is safe to ensure Yahoo Finance is updated.
    - cron: '0 10 * * 1-5'
  workflow_dispatch: # Allow manual trigger from GitHub UI

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Need write permission to commit back to the repo

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: pip install -r requirements.txt

    - name: Run data generation script
      run: python generate_data.py

    - name: Commit and push changes
      run: |
        git config --local user.name 'github-actions[bot]'
        git config --local user.email 'github-actions[bot]@users.noreply.github.com'
        git add data/data.json
        # Only commit and push if there are changes
        if ! git diff-index --quiet HEAD; then
          git commit -m "chore: auto-update historical data"
          git push
        else
          echo "No changes to commit"
        fi
