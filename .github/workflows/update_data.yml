name: Update Historical Data

on:
  schedule:
    # Run at 16:25, 18:25, 20:25 Taiwan time (08:25, 10:25, 12:25 UTC) Mon-Fri
    # Taiwan market closes at 13:30, TAIFEX publishes post-market settlement at ~15:00.
    # Non-zero minutes avoid GitHub Actions congestion at top of the hour.
    - cron: '25 8,10,12 * * 1-5'
  workflow_dispatch: # Allow manual trigger from GitHub UI

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Need write permission to commit back to the repo

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: pip install -r requirements.txt

    - name: Run data generation script
      run: |
        python generate_data.py
        python fetch_margins.py || echo "margin fetch failed, keep old file"

    - name: Commit and push changes
      run: |
        git config --local user.name 'github-actions[bot]'
        git config --local user.email 'github-actions[bot]@users.noreply.github.com'
        git add data/data.json data/margins.json
        # Only commit and push if there are changes
        if ! git diff-index --quiet HEAD; then
          git commit -m "chore: auto-update historical data"
          git push
        else
          echo "No changes to commit"
        fi
